services:
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: authentication_service
      MONGO_INITDB_ROOT_PASSWORD: mongo123
  mysql-db:
    image: mysql:8.0
    container_name: mysql_server
    environment:
      MYSQL_ROOT_PASSWORD: customer_service
      MYSQL_DATABASE: customer_service
      MYSQL_USER: customer_service
      MYSQL_PASSWORD: customer_service
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis/redis-stack:latest
    container_name: redis
    ports:
      - "6379:6379"
      - "8001:8001"

  config-service:
    build:
      context: ./Config_Service
    container_name: config-service
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/discovery-service/default || bash -c '</dev/tcp/127.0.0.1/8088' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  discovery-service:
    build:
      context: ./Discovery_Service
    container_name: discovery-service
    ports:
      - "8061:8061"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-service:8088
    depends_on:
      config-service:
        condition: service_healthy

  authentication-service:
    build:
      context: ./Authentication_Service
    container_name: authentication-service
    ports:
      - "9000:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-service:8088
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  customer-service:
    build:
      context: ./Customer_Service
    container_name: customer-service
    ports:
      - "9001:9001"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-service:8088
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
      mysql-db:
        condition: service_started

  api-gateway-service:
    build:
      context: ./ApiGateway_Service
    container_name: api-gateway-service
    ports:
      - "8060:8060"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-service:8088
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
volumes:
  mongodb:
  redis-data:
  mysql_data:
