services:
  redis:
    image: redis/redis-stack:latest
    container_name: redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data

  config-service:
    build:
      context: ./Config_Service
    container_name: config-service
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/discovery-service/default || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  discovery-service:
    build:
      context: ./Discovery_Service
    container_name: discovery-service
    ports:
      - "8061:8061"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-service:8088
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8061/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      config-service:
        condition: service_healthy

  authentication-service:
    build:
      context: ./Authentication_Service
    container_name: authentication-service
    ports:
      - "9000:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-service:8088
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_started

  customer-service:
    build:
      context: ./Customer_Service
    container_name: customer-service
    ports:
      - "9001:9001"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-service:8088
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  api-gateway-service:
    build:
      context: ./ApiGateway_Service
    container_name: api-gateway-service
    ports:
      - "8060:8060"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-service:8088
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  fleet-service:
    build:
      context: ./Fleet_Service
    container_name: fleet-service
    ports:
      - "9002:9002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=9002
    depends_on:
      discovery-service:
        condition: service_started

  news-service:
    build:
      context: ./News_Service
    container_name: news-service
    ports:
      - "9003:9003"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-service:8088
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

volumes:
  redis-data: