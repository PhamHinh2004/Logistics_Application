spring:
  datasource:
    url: jdbc:mysql://mysql-2f647711-hinh-deeb.e.aivencloud.com:15123/customer_service?sslMode=REQUIRED
    username: ${AIVEN_USER}
    password: ${AIVEN_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://discovery-service:8061/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:customer-service}
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}

server:
  port: 9001
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
