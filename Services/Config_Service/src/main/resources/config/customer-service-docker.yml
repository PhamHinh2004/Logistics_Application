spring:
  datasource:
    url: jdbc:mysql://mysql-server:3306/customer_service
    username: customer_service
    password: customer_service
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8061/eureka
server:
  port: 9001
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never