spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: lb://AUTHENTICATION-SERVICE
            predicates:
              - Path=/account/**
          - id: role-service
            uri: lb://AUTHENTICATION-SERVICE
            predicates:
              - Path=/api/roles/**
          - id: customer-service
            uri: lb://CUSTOMER-SERVICE
            predicates:
              - Path=/api/v1/customers/**
          - id: news-service
            uri: lb://NEWS-SERVICE
            predicates:
              - Path=/v1/api/news/**
            # ASP.NET Core — dùng URL trực tiếp
          - id: container-service
            uri: ${FLEET_SERVICE_URL:http://localhost:9002}
            predicates:
              - Path=/api/container/**
          - id: driver-service
            uri: ${FLEET_SERVICE_URL:http://localhost:9002}
            predicates:
              - Path=/api/driver/**
          - id: vehicle-service
            uri: ${FLEET_SERVICE_URL:http://localhost:9002}
            predicates:
              - Path=/api/vehicle/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8061/eureka

server:
  port: 8060

app:
  jwtSecret: aEgC6orb0GXD2sQwg2Vn3aTiVqmDMUtset7wi8mFJcY
  jwtExpirationMs: 86400000
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never