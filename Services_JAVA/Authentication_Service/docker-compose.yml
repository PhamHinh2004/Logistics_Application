services:
#  config mongodb:
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: authentication_service
      MONGO_INITDB_ROOT_PASSWORD: mongo123
#  config redis:
  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001"   # RedisInsight UI để debug
    volumes:
      - redis-data:/data

volumes:
  mongodb:
    external: true
  redis-data: